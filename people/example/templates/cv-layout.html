<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title data-cv-text="meta.title">CV</title>
    <link rel="stylesheet" href="../common/cv-base.css">
</head>

<body>

    <!-- Main Content -->
    <div class="main-content">
        <h1 data-cv-text="personal.name">NAME</h1>
        <div class="subtitle" data-cv-text="personal.subtitle">Title</div>

        <!-- MAIN SECTIONS (experience, projects, education, volunteering) -->
        <div data-cv-section="mainSections"></div>
    </div>

    <!-- Right Blue Sidebar -->
    <div class="sidebar">
        <div class="photo" data-cv-photo="personal.photo">
            <!-- Photo will be injected here -->
        </div>

        <!-- SIDEBAR SECTIONS (summary, skills, languages, contact, online, interests) -->
        <div data-cv-section="sidebarSections"></div>
    </div>

</body>

</html>
